<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>ضمان سايت | DamanSite</title>
  <meta name="theme-color" content="#0f172a" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="ضمان سايت" />
  <link rel="manifest" href="./manifest.json" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
  <script src="https://cdn.tailwindcss.com"></script>

  <style>
    body { font-family: 'Cairo', sans-serif; -webkit-tap-highlight-color: transparent; }
    .glass-card { background: rgba(30, 41, 59, 0.72); backdrop-filter: blur(12px); border: 1px solid rgba(148, 163, 184, 0.14); }
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
  </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex justify-center antialiased">
  <div id="app-shell" class="w-full max-w-md min-h-screen bg-slate-950 flex flex-col relative pb-24 shadow-2xl border-x border-slate-900">

    <!-- Toast Container -->
    <div id="toast-container" class="fixed top-4 left-1/2 -translate-x-1/2 z-50 w-[90%] max-w-sm space-y-2 pointer-events-none"></div>

    <!-- Top Header -->
    <header class="sticky top-0 z-40 bg-slate-900/95 backdrop-blur-md border-b border-slate-800 px-3.5 py-3 flex items-center justify-between gap-2">
      <div onclick="DamanApp.switchTab('home')" class="flex items-center gap-2.5 cursor-pointer min-w-0">
        <div class="w-9 h-9 shrink-0 rounded-xl bg-gradient-to-tr from-amber-500 to-amber-400 text-slate-950 flex items-center justify-center shadow">
          <i class="fa-solid fa-helmet-safety text-base"></i>
        </div>
        <div class="min-w-0">
          <h1 class="font-black text-sm text-white leading-none truncate" data-i18n="appName">ضمان سايت</h1>
          <p class="text-[10px] text-slate-400 mt-0.5 truncate" data-i18n="tagline">منصة العقود والضمان الهندسي والمالي</p>
        </div>
      </div>

      <div class="flex items-center gap-1.5 shrink-0">
        <button id="header-admin-btn" onclick="DamanApp.switchTab('admin')" class="hidden px-2.5 py-1.5 rounded-lg bg-amber-500/20 border border-amber-500/40 text-amber-300 text-[11px] font-extrabold flex items-center gap-1">
          <i class="fa-solid fa-crown"></i><span data-i18n="adminBtn">الإدارة</span>
        </button>

        <button id="header-notif-btn" onclick="DamanApp.openNotifications()" class="hidden relative w-8 h-8 rounded-lg bg-slate-800 text-slate-200 flex items-center justify-center text-xs">
          <i class="fa-solid fa-bell"></i>
          <span id="notif-badge" class="hidden absolute -top-1 -right-1 min-w-[16px] h-4 px-1 rounded-full bg-rose-500 text-white text-[9px] font-black flex items-center justify-center">0</span>
        </button>

        <button id="header-auth-btn" onclick="DamanApp.openAuthModal('login')" class="px-2.5 py-1.5 rounded-lg bg-amber-500 text-slate-950 text-[11px] font-extrabold" data-i18n="loginBtn">دخول</button>

        <button onclick="DamanApp.toggleLanguage()" class="px-2 py-1.5 rounded-lg bg-slate-800 hover:bg-slate-700 text-slate-200 text-[11px] font-bold">
          <span id="lang-btn-text">EN</span>
        </button>
      </div>
    </header>

    <!-- Main Dynamic Viewport -->
    <main id="app-main" class="flex-1 p-3.5"></main>

    <!-- Bottom Navigation -->
    <nav class="fixed bottom-0 left-1/2 -translate-x-1/2 w-full max-w-md z-40 bg-slate-900/95 backdrop-blur-md border-t border-slate-800 px-2 py-2 grid grid-cols-5">
      <button onclick="DamanApp.switchTab('home')" data-tab="home" class="nav-btn flex flex-col items-center gap-0.5 text-amber-400">
        <i class="fa-solid fa-house text-base"></i>
        <span class="text-[10px] font-bold" data-i18n="navHome">الرئيسية</span>
      </button>
      <button onclick="DamanApp.switchTab('projects')" data-tab="projects" class="nav-btn flex flex-col items-center gap-0.5 text-slate-400">
        <i class="fa-solid fa-briefcase text-base"></i>
        <span class="text-[10px] font-bold" data-i18n="navProjects">المشاريع</span>
      </button>
      <button onclick="DamanApp.switchTab('wallet')" data-tab="wallet" class="nav-btn flex flex-col items-center gap-0.5 text-slate-400">
        <i class="fa-solid fa-wallet text-base"></i>
        <span class="text-[10px] font-bold" data-i18n="navWallet">المحفظة</span>
      </button>
      <button onclick="DamanApp.switchTab('chat')" data-tab="chat" class="nav-btn flex flex-col items-center gap-0.5 text-slate-400">
        <i class="fa-solid fa-comments text-base"></i>
        <span class="text-[10px] font-bold" data-i18n="navChat">الدردشة</span>
      </button>
      <button onclick="DamanApp.switchTab('profile')" data-tab="profile" class="nav-btn flex flex-col items-center gap-0.5 text-slate-400">
        <i class="fa-solid fa-user text-base"></i>
        <span class="text-[10px] font-bold" data-i18n="navProfile">حسابي</span>
      </button>
    </nav>
  </div>

  <!-- Auth Modal -->
  <div id="auth-modal" class="hidden fixed inset-0 z-50 bg-black/80 backdrop-blur-sm flex items-center justify-center p-4">
    <div class="w-full max-w-sm bg-slate-900 border border-slate-700 rounded-2xl p-4 max-h-[90vh] overflow-y-auto">
      <div class="flex items-center justify-between mb-3">
        <h3 class="text-sm font-extrabold text-white">حساب ضمان سايت | DamanSite</h3>
        <button onclick="DamanApp.closeModal('auth-modal')" class="text-slate-400 hover:text-white"><i class="fa-solid fa-xmark"></i></button>
      </div>

      <div class="flex gap-1 bg-slate-950 p-1 rounded-xl mb-4">
        <button id="tab-login-btn" onclick="DamanApp.setAuthMode('login')" class="flex-1 py-2 text-xs font-extrabold rounded-lg bg-amber-500 text-slate-950">تسجيل الدخول</button>
        <button id="tab-reg-btn" onclick="DamanApp.setAuthMode('register')" class="flex-1 py-2 text-xs font-bold rounded-lg text-slate-400">حساب جديد</button>
      </div>

      <form id="login-form" class="space-y-3">
        <input id="login-email" type="email" required placeholder="البريد الإلكتروني / Email" class="w-full px-3 py-2.5 rounded-xl bg-slate-950 border border-slate-700 text-xs text-white" />
        <input id="login-pass" type="password" required placeholder="كلمة المرور / Password" class="w-full px-3 py-2.5 rounded-xl bg-slate-950 border border-slate-700 text-xs text-white" />
        <button type="submit" class="w-full py-2.5 rounded-xl bg-amber-500 text-slate-950 font-extrabold text-xs">دخول / Sign In</button>
      </form>

      <form id="register-form" class="hidden space-y-2.5">
        <select id="reg-role" onchange="DamanApp.toggleCompanyFields('reg-role','reg-company-box')" class="w-full px-3 py-2.5 rounded-xl bg-slate-950 border border-amber-500/40 text-xs text-white font-bold">
          <option value="client">عميل / مالك مشروع (Client)</option>
          <option value="contractor">مقاول / فني فردي (Contractor)</option>
          <option value="company">شركة مقاولات / مكتب هندسي (Company)</option>
        </select>
        <input id="reg-name" type="text" required placeholder="الاسم بالكامل / Full Name" class="w-full px-3 py-2.5 rounded-xl bg-slate-950 border border-slate-700 text-xs text-white" />
        <input id="reg-phone" type="tel" required placeholder="رقم الموبايل / Phone" class="w-full px-3 py-2.5 rounded-xl bg-slate-950 border border-slate-700 text-xs text-white" />
        <div id="reg-company-box" class="hidden space-y-2.5 p-2.5 rounded-xl bg-slate-950/70 border border-sky-500/30">
          <input id="reg-company-name" type="text" placeholder="اسم الشركة أو المكتب الهندسي" class="w-full px-3 py-2 rounded-lg bg-slate-900 border border-slate-700 text-xs text-white" />
          <input id="reg-company-cr" type="text" placeholder="رقم السجل التجاري / البطاقة الضريبية (اختياري الآن)" class="w-full px-3 py-2 rounded-lg bg-slate-900 border border-slate-700 text-xs text-white" />
        </div>
        <input id="reg-email" type="email" required placeholder="البريد الإلكتروني / Email" class="w-full px-3 py-2.5 rounded-xl bg-slate-950 border border-slate-700 text-xs text-white" />
        <input id="reg-pass" type="password" required minlength="6" placeholder="كلمة المرور (6 أحرف على الأقل)" class="w-full px-3 py-2.5 rounded-xl bg-slate-950 border border-slate-700 text-xs text-white" />
        <button type="submit" class="w-full py-2.5 rounded-xl bg-amber-500 text-slate-950 font-extrabold text-xs">إنشاء الحساب / Register</button>
      </form>

      <div class="my-3 flex items-center gap-2 text-[10px] text-slate-500">
        <span class="flex-1 h-px bg-slate-800"></span><span>أو / OR</span><span class="flex-1 h-px bg-slate-800"></span>
      </div>
      <button onclick="DamanApp.googleSignIn()" class="w-full py-2.5 rounded-xl bg-white text-slate-900 font-extrabold text-xs flex items-center justify-center gap-2">
        <i class="fa-brands fa-google text-rose-500"></i> المتابعة بحساب Google
      </button>
    </div>
  </div>

  <!-- First-Time Google Onboarding Modal -->
  <div id="onboarding-modal" class="hidden fixed inset-0 z-50 bg-black/85 backdrop-blur-sm flex items-center justify-center p-4">
    <div class="w-full max-w-sm bg-slate-900 border border-amber-500/40 rounded-2xl p-4">
      <h3 class="text-sm font-extrabold text-amber-400 mb-1">استكمال بيانات الحساب</h3>
      <p class="text-[11px] text-slate-400 mb-3">اختر نوع حسابك عشان نجهّزلك الصلاحيات المناسبة</p>
      <form id="onboarding-form" class="space-y-2.5">
        <select id="ob-role" onchange="DamanApp.toggleCompanyFields('ob-role','ob-company-box')" class="w-full px-3 py-2.5 rounded-xl bg-slate-950 border border-amber-500/40 text-xs text-white font-bold">
          <option value="client">عميل / مالك مشروع (Client)</option>
          <option value="contractor">مقاول / فني فردي (Contractor)</option>
          <option value="company">شركة مقاولات / مكتب هندسي (Company)</option>
        </select>
        <input id="ob-name" type="text" required placeholder="الاسم بالكامل" class="w-full px-3 py-2.5 rounded-xl bg-slate-950 border border-slate-700 text-xs text-white" />
        <input id="ob-phone" type="tel" required placeholder="رقم الموبايل" class="w-full px-3 py-2.5 rounded-xl bg-slate-950 border border-slate-700 text-xs text-white" />
        <div id="ob-company-box" class="hidden space-y-2.5 p-2.5 rounded-xl bg-slate-950/70 border border-sky-500/30">
          <input id="ob-company-name" type="text" placeholder="اسم الشركة أو المكتب الهندسي" class="w-full px-3 py-2 rounded-lg bg-slate-900 border border-slate-700 text-xs text-white" />
          <input id="ob-company-cr" type="text" placeholder="رقم السجل التجاري (اختياري الآن)" class="w-full px-3 py-2 rounded-lg bg-slate-900 border border-slate-700 text-xs text-white" />
        </div>
        <button type="submit" class="w-full py-2.5 rounded-xl bg-amber-500 text-slate-950 font-extrabold text-xs">حفظ وبدء الاستخدام</button>
      </form>
    </div>
  </div>

  <!-- Notifications Modal -->
  <div id="notifications-modal" class="hidden fixed inset-0 z-50 bg-black/75 backdrop-blur-sm flex items-end sm:items-center justify-center p-3">
    <div class="w-full max-w-sm bg-slate-900 border border-slate-700 rounded-2xl p-4 max-h-[75vh] flex flex-col">
      <div class="flex items-center justify-between mb-3">
        <h3 class="text-sm font-extrabold text-white"><i class="fa-solid fa-bell text-amber-400 me-1.5"></i> الإشعارات</h3>
        <button onclick="DamanApp.closeModal('notifications-modal')" class="text-slate-400"><i class="fa-solid fa-xmark"></i></button>
      </div>
      <div id="notif-list" class="space-y-2 overflow-y-auto flex-1"></div>
    </div>
  </div>

  <!-- Firebase Compat SDKs -->
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>

  <!-- Core & Phase Modules -->
  <script src="./categories.js"></script>
  <script src="./app-core.js"></script>
  <script src="./wallet.js" defer></script>
  <script src="./projects-escrow.js" defer></script>
  <script src="./chat-support.js" defer></script>
  <script src="./company-panel.js" defer></script>
  <script src="./admin.js" defer></script>
</body>
</html>
